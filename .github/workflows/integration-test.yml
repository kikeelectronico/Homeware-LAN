name: Integration test
on:
  workflow_dispatch:

env:
  REDIS_VERSION: "6.2.20"
  MONGODB_VERSION: "8.0.19"
  PYTHON_VERSION: 3.12
  MOSQUITTO_VERSION: 2.0
  VM_NAME: homeware-integration-test-dev
  VM_ZONE: europe-southwest1-a
  PROXY_NS: homeware-test-proxy
  PROXY_SLICE: vm-backend-slice

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  unit_test_backend:
    name: Unit test backend
    runs-on: ubuntu-latest
    env:
      HOMEWARE_USER: admin
      HOMEWARE_PASSWORD: admin
    steps:
      - uses: actions/checkout@v7
      - name: Start Redis ${{env.REDIS_VERSION}}
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: ${{env.REDIS_VERSION}}
      - name: Start MongoDB ${{env.MONGODB_VERSION}}
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{env.MONGODB_VERSION}}
      - name: Start Mosquitto broker ${{env.MOSQUITTO_VERSION}}
        uses: Namoshek/mosquitto-github-action@v1
        with:
          version: ${{env.MOSQUITTO_VERSION}}
          ports: '1883:1883'
          password-file: ${{ github.workspace }}/configuration_templates/mosquitto_passwd
      - name: Set up Python ${{env.PYTHON_VERSION}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./back
      - name: Install Pytest
        run: pip install pytest
        working-directory: ./back
      - name: Test
        run: pytest -v -s tests/unit_tests
        working-directory: ./back

  build_and_push_backend:
    name: Build and push backend
    runs-on: ubuntu-latest
    needs: unit_test_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGES_TOKEN }}
      - name: Build and push BE
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile-back
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/homewarelan-back:dev

  build_push_frontend:
    name: Build and push frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGES_TOKEN }}
      - name: Build and push FE
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile-nginx
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/homewarelan-nginx:dev

  create_gcloud_vm:
    name: Create VM
    runs-on: ubuntu-latest
    needs: [
      build_and_push_backend,
      build_push_frontend
    ]
    outputs:
      vm_ip: ${{ steps.create.outputs.vm_ip }}
    steps:
      - uses: "actions/checkout@v7"
      - uses: "google-github-actions/auth@v3"
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_ACCOUNT }}
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          project_id: ${{ secrets.GCLOUD_PROJECT_ID }}
      - name: "Create VM"
        id: create
        run: |
          IP=$(gcloud compute instances create "$VM_NAME" \
                 --source-instance-template=homeware-test-dev \
                 --zone="$VM_ZONE" \
                 --format='value(networkInterfaces[0].accessConfigs[0].natIP)')
          [ -n "$IP" ] || { echo "No se obtuvo IP"; exit 1; }
          echo "vm_ip=$IP" >> "$GITHUB_OUTPUT"

  publish_ip_to_proxy:
    name: Publish VM IP in proxy
    runs-on: ci-runner
    needs: create_gcloud_vm
    steps:
      - name: Publish EndpointSlice
        run: |
          kubectl apply -n "$PROXY_NS" -f - <<EOF
          apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: $PROXY_SLICE
            labels:
              kubernetes.io/service-name: vm-backend
          addressType: IPv4
          ports:
          - {name: http, port: 80, protocol: TCP}
          - {name: https, port: 443, protocol: TCP}
          endpoints:
          - addresses: ["${{ needs.create_gcloud_vm.outputs.vm_ip }}"]
            conditions: {ready: true}
          EOF

  wait_for_homware:
    name: Wait for homeware to boot
    runs-on: ubuntu-latest
    needs: publish_ip_to_proxy
    steps:
      - uses: "actions/checkout@v7"
      - name: "Wait until Homeware is ready"
        uses: cygnetdigital/wait_for_response@v2.0.0
        with:
          url: ${{ secrets.HOMEWARE_HOST }}
          responseCode: '200'
          timeout: 480000
          interval: 5000

  integration_test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: wait_for_homware
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{env.PYTHON_VERSION}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./back
      - name: Install dependencies
        run: pip install pytest
        working-directory: ./back
      - name: Test
        run: pytest -v --host=${{ secrets.HOMEWARE_HOST }} --username=${{ secrets.HOMEWARE_USERNAME }} --password=${{ secrets.HOMEWARE_PASSWORD }}
        working-directory: ./back/tests/integration_tests

  unpublish_ip_from_proxy:
    name: Remove VM IP from proxy
    runs-on: ci-runner
    needs: integration_test
    if: ${{ always() }}
    steps:
      - name: Delete EndpointSlice
        run: |
          kubectl delete endpointslice "$PROXY_SLICE" -n "$PROXY_NS" --ignore-not-found
          sleep 5

  delete_gcloud_vm:
    name: Delete VM
    runs-on: ubuntu-latest
    needs: unpublish_ip_from_proxy
    if: ${{ always() }}
    steps:
      - uses: "actions/checkout@v7"
      - uses: "google-github-actions/auth@v3"
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_ACCOUNT }}
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          project_id: ${{ secrets.GCLOUD_PROJECT_ID }}
      - name: "Delete VM"
        run: |
          gcloud compute instances delete "$VM_NAME" --zone="$VM_ZONE" --quiet \
            || echo "La VM no existía"
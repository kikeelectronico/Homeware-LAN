version: 2
updates:
- package-ecosystem: pip
  directory: "/back"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  target-branch: dev
- package-ecosystem: npm
  directory: "/front"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  target-branch: dev
  groups:
    mui:
      patterns:
        - "@mui/*"
- package-ecosystem: npm
  directory: "/docs"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  target-branch: dev
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 10
  target-branch: dev
